<!DOCTYPE html>
<html lang="id" data-bs-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Program Implementasi Blockchain</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="style.css" rel="stylesheet">
</head>
<body>

  <nav class="navbar border-bottom sticky-top bg-body">
    <div class="container">
      <a class="navbar-brand fw-bold" href="#">
        <i class="bi bi-boxes text-info me-2"></i>Blockchain Demo
      </a>
      <span class="navbar-text small d-none d-md-inline">SHA-256 &bull; Proof of Work</span>
    </div>
  </nav>

  <main class="container-fluid px-4 py-3">

    <!-- Statistik -->
    <div class="row g-3 mb-3">
      <div class="col-4">
        <div class="card stat-card h-100">
          <div class="card-body py-2">
            <div class="text-secondary small">Jumlah Blok</div>
            <div class="fs-4 fw-bold" id="statBlocks">0</div>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="card stat-card h-100">
          <div class="card-body py-2">
            <label class="text-secondary small" for="difficulty">Tingkat Kesulitan</label>
            <select id="difficulty" class="form-select form-select-sm">
              <option value="1">1 (sangat cepat)</option>
              <option value="2">2</option>
              <option value="3" selected>3</option>
              <option value="4">4 (lambat)</option>
            </select>
          </div>
        </div>
      </div>
      <div class="col-4">
        <div class="card stat-card h-100">
          <div class="card-body py-2">
            <div class="text-secondary small">Status Rantai</div>
            <div class="fs-5 fw-bold" id="statValid">-</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Form tambah blok (satu baris) -->
    <div class="card mb-3">
      <div class="card-body py-3">
        <form id="blockForm" class="row g-2 align-items-end" novalidate>
          <div class="col-md">
            <label class="form-label small mb-1" for="dataInput">Data blok baru</label>
            <input type="text" class="form-control" id="dataInput"
              placeholder="Contoh: 05112026UNPRI0000" autocomplete="off">
          </div>
          <div class="col-md-auto">
            <button type="submit" class="btn btn-success w-100" id="btnMine">
              <i class="bi bi-hammer me-1"></i>Mine Blok
            </button>
          </div>
        </form>
        <div class="progress mt-2 d-none" id="mineProgress" style="height: 5px;">
          <div class="progress-bar progress-bar-striped progress-bar-animated w-100"></div>
        </div>
        <div class="small text-secondary mt-1" id="mineStatus"></div>
      </div>
    </div>

    <!-- Rantai blok -->
    <div class="d-flex justify-content-between align-items-center mb-2">
      <h5 class="mb-0"><i class="bi bi-link-45deg me-1"></i>Rantai Blok</h5>
      <div class="d-flex align-items-center gap-3">
        <span class="small text-secondary d-none d-md-inline">Ubah kotak Data di blok mana pun untuk simulasi manipulasi</span>
        <button class="btn btn-outline-danger btn-sm" id="btnReset">
          <i class="bi bi-arrow-counterclockwise me-1"></i>Reset
        </button>
      </div>
    </div>
    <div id="chain" class="chain-row"></div>

  </main>

  <footer class="text-center text-secondary small py-4 border-top">
    Demo edukasi blockchain &mdash; dibuat dengan Bootstrap 5
  </footer>

  <div class="toast-container position-fixed bottom-0 end-0 p-3">
    <div id="appToast" class="toast align-items-center border-0" role="alert">
      <div class="d-flex">
        <div class="toast-body" id="toastBody"></div>
        <button type="button" class="btn-close me-2 m-auto" data-bs-dismiss="toast"></button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
